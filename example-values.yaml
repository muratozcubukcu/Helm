# Example values file for nginx-app chart
# Copy this file and modify as needed for your deployment

# Scale to 3 replicas for high availability
replicaCount: 3

# Use a specific nginx version
image:
  repository: nginx
  tag: "1.25"
  pullPolicy: IfNotPresent

# Configure service as LoadBalancer for external access
service:
  type: LoadBalancer
  port: 80
  targetPort: 80

# Enable ingress for domain-based access
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: myapp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: myapp-tls
      hosts:
        - myapp.example.com

# Set resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Configure health checks
livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Add pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "80"

# Configure node selector (optional)
# nodeSelector:
#   kubernetes.io/os: linux

