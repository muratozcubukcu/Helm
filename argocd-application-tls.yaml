apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app-tls
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: production
    app: nginx-app
spec:
  project: production
  source:
    repoURL: https://github.com/muratozcubukcu/Helm.git
    targetRevision: HEAD
    path: .
    helm:
      valueFiles:
        - values.yaml
      values: |
        ingress:
          enabled: true
          className: nginx
          annotations:
            kubernetes.io/ingress.class: nginx
          hosts:
            - host: your-domain.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: nginx-app-tls
              hosts:
                - your-domain.com
        certManager:
          enabled: true
          clusterIssuer: letsencrypt-prod
          email: admin@your-domain.com
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-app-tls
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m 